name = "niho-web-studio"
account_id = "bf9271e82c9c53c9ca408f50504ad597"
main = "./dist/worker.js"
compatibility_date = "2026-10-21"
workers_dev = false

[[routes]]
pattern = "studio.niho.life"
custom_domain = true

[vars]
ACCESS_ISSUER = "https://niho-coliving.cloudflareaccess.com"
ACCESS_AUDIENCE = "96abc0d3e1c4d97de7496d126d9119ba14761959cb3a10f7dabbf2718f668ce5"

[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[services]]
binding = "KAMAKURA_SITE"
service = "kamakura-site"

[[d1_databases]]
binding = "DB"
database_name = "niho-web-studio"
database_id = "b2af4e2e-34c2-496f-b735-6d285fcf7365"
migrations_dir = "migrations"
