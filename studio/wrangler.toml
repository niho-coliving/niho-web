name = "niho-web-studio"
main = "./dist/worker.js"
compatibility_date = "2026-10-21"
workers_dev = false

[vars]
ACCESS_ISSUER = "https://YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUDIENCE = "REPLACE_WITH_ACCESS_APPLICATION_AUD_TAG"

[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "niho-web-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
