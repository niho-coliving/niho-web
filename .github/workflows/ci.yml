name: Public package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - if: matrix.react == '18'
        run: npm install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1 @types/react@18.3.27 @types/react-dom@18.3.7
      - run: npm run typecheck
      - run: npm run studio:typecheck
      - run: npm run studio:build
      - run: npm test
      - run: npm pack --dry-run
